<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131b">
  <meta name="description" content="25分+5分、30秒+10秒を切り替えて使えるシンプルな集中タイマー。オフライン対応。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flow Timer">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Flow Timer</title>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <div class="app-shell">
    <main class="timer-panel" id="timer-panel" data-phase="work" data-mode="pomodoro">
      <div class="mode-tabs" role="tablist" aria-label="タイマーモード">
        <button class="mode-tab is-selected" type="button" id="tab-pomodoro" role="tab" aria-selected="true" aria-controls="timer-content" data-mode="pomodoro">
          <span class="mode-name">Pomodoro</span>
          <span class="mode-duration">25分 / 5分</span>
        </button>
        <button class="mode-tab" type="button" id="tab-hft" role="tab" aria-selected="false" aria-controls="timer-content" tabindex="-1" data-mode="hft">
          <span class="mode-name">HFT</span>
          <span class="mode-duration">30秒 / 10秒</span>
        </button>
      </div>

      <section class="timer-content" id="timer-content" role="tabpanel" aria-labelledby="tab-pomodoro">
        <div class="session-line">
          <span class="session-counter">完了 <strong id="completed-count">0</strong> セット</span>
        </div>

        <div class="timer-ring" id="timer-ring" role="timer" aria-label="残り時間" aria-live="off">
          <div class="ring-center">
            <span class="phase-pill" id="phase-text">集中タイム</span>
            <p class="time-display" id="time-display" aria-label="25分00秒">25:00</p>
          </div>
        </div>

        <div class="countdown-slot" aria-live="off">
          <span class="countdown-cue" id="countdown-cue" hidden>あと <strong id="countdown-number">3</strong> 秒で切り替え</span>
        </div>

        <div class="control-row">
          <button type="button" class="control-button secondary-button" id="reset-button" aria-label="タイマーをリセット">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.65 6.35"/><path d="M3 4v7h7"/></svg>
            <span>リセット</span>
          </button>
          <button type="button" class="control-button main-button" id="start-button" data-running="false">
            <svg class="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.7a1 1 0 0 1 1.5-.86l10 6.3a1 1 0 0 1 0 1.72l-10 6.3A1 1 0 0 1 8 18.3z"/></svg>
            <svg class="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
            <span id="start-label">開始する</span>
          </button>
          <button type="button" class="control-button secondary-button" id="skip-button" aria-label="次の時間へスキップ">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 5 9 7-9 7V5Z"/><path d="m14 5 9 7-9 7V5Z"/></svg>
            <span>スキップ</span>
          </button>
        </div>

        <div class="panel-bottom">
          <div class="notification-info">
            <span class="small-label">予告音</span>
            <strong id="warning-times">集中終了の10分前・5分前</strong>
          </div>
          <div class="sound-controls">
            <button type="button" class="sound-toggle" id="sound-toggle" aria-pressed="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 5-5 4H3v6h3l5 4V5Z"/><path class="volume-wave" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="volume-wave" d="M18.5 5.5a9 9 0 0 1 0 13"/><path class="mute-line" d="m16 9 5 6m0-6-5 6"/></svg>
              <span id="sound-label">音 ON</span>
            </button>
            <button type="button" class="test-sound" id="test-sound">試聴</button>
          </div>
        </div>
      </section>
    </main>

  </div>
  <div class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
